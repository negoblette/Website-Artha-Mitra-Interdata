# Nginx Configuration for Artha Mitra Interdata Website
# Poin 17: File Permission & Security Configuration
# Standard: OWASP A05 / OWASP ASVS

# Rate limiting zone
# Limits requests per IP to prevent abuse
limit_req_zone $binary_remote_addr zone=ami:10m rate=10r/s;

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name arthamitra.co.id www.arthamitra.co.id;

    # Redirect all HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

limit_conn_zone $binary_remote_addr zone=ami_conn:10m;
limit_conn_status 429;

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name arthamitra.co.id www.arthamitra.co.id;

    # SSL Configuration (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/arthamitra.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arthamitra.co.id/privkey.pem;

    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL Session Settings
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;

    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
    keepalive_timeout 30s;

    # Security Headers
    # CSP dikelola oleh Next.js (next.config.mjs) dengan kebijakan berbeda per route
    # (public vs admin vs API). Nginx hanya menambahkan header non-CSP.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Logging
    access_log /var/log/ami/nginx-access.log;
    error_log /var/log/ami/nginx-error.log;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Client body size limit (for file uploads)
    client_max_body_size 10M;

    # Static files caching (long cache for immutable assets)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Next.js static files (optimized caching)
    location /_next/static/ {
        alias /var/www/ami/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Public files (images, uploads)
    location /public/ {
        alias /var/www/ami/public/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Upload directory (special handling)
    location /uploads/ {
        alias /var/www/ami/public/uploads/;
        expires 30d;
        add_header Cache-Control "public";

        # Disable script execution in uploads
        location ~* \.(php|cgi|pl|asp|aspx|jsp)$ {
            deny all;
        }
    }

    # API routes with rate limiting
    location /api/ {
        limit_req zone=ami burst=20 nodelay;
        limit_conn ami_conn 20;
        limit_req_status 429;

        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Security: Hide backend headers
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # Admin routes with additional security
    location /admin/ {
        # Optional: IP whitelist (uncomment and modify as needed)
        # allow 192.168.1.0/24;
        # allow 10.0.0.0/8;
        # deny all;
        limit_conn ami_conn 10;

        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Additional security headers for admin
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Main application
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Security: Hide backend headers
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # Block access to hidden files (security)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to .env files
    location ~* \.env$ {
        deny all;
    }

    # Block access to sensitive files
    location ~* \.(bak|config|sql|log|ini|sh|swp|backup)$ {
        deny all;
    }

    # Health check endpoint (for monitoring)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
