name: Security Audit

on:
  # Run weekly
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9am

  # Run on push to main
  push:
    branches: [main, sakil-dev]

  # Run on pull requests
  pull_request:
    branches: [main]

  # Manual trigger
  workflow_dispatch:

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=critical

      - name: Check for outdated packages
        run: npm outdated || true

      - name: Run custom security audit script
        run: node scripts/security-audit.js
        continue-on-error: true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-report
          path: my-app/security-reports/
          retention-days: 30

      - name: Notify on critical vulnerabilities
        if: failure()
        run: |
          echo "::error::Critical security vulnerabilities detected!"
          echo "Review the security audit report in the artifacts."
          # Add Slack/email notification here if needed
