version: 2
updates:
  # Enable security updates for npm dependencies
  - package-ecosystem: "npm"
    directory: "/my-app"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Jakarta"

    # Only open PRs for security updates
    open-pull-requests-limit: 10

    # Labels for PRs
    labels:
      - "dependencies"
      - "security"

    # Reviewers (optional - add your team)
    # reviewers:
    #   - "username"

    # Commit message prefix
    commit-message:
      prefix: "security"
      include: "scope"

    # Groups - batch minor/patch updates together
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

    # Ignore specific major versions (if needed)
    # ignore:
    #   - dependency-name: "swiper"
    #     update-types: ["version-update:semver-major"]
